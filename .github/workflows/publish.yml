# Publish @luminet/design-library to npm when a version tag is pushed.
#
# Required secret: NPM_TOKEN — npm automation token with publish access to @luminet/design-library.
# Without NPM_TOKEN configured in GitHub (Settings → Secrets and variables → Actions),
# this workflow will fail; use manual steps in PUBLISH.md instead.

name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
